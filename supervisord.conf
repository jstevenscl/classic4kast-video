; Three services, three separate OS processes -- a crash/OOM in one is
; restarted independently by supervisord and never takes another down (same
; blast-radius protection the old 3-container split gave, without three
; containers).
;
; CPU priority ("smarter than nothing" resource sharing, not a hard cgroup
; partition -- see the Dockerfile's header comment): the web-channel
; renderer (Node + everything it spawns -- Chromium, its own per-channel
; ffmpeg) is niced BELOW normal (+10); the weather renderer stays at the
; default (0) rather than being niced ABOVE normal, since raising priority
; needs CAP_SYS_NICE, which isn't guaranteed to be available (fails safely
; but silently under a restricted container runtime -- confirmed live).
; Lowering the OTHER process's priority achieves the same relative
; protection without needing any special capability. `nice` is inherited by
; child processes on fork, so Chromium/ffmpeg launched by the web-channel
; renderer run at the same lowered priority as their parent automatically --
; under real CPU contention the kernel scheduler favors the weather fleet.

[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:renderer]
command=python3 -m renderer.on_demand_server
directory=/app/renderer
environment=DATA_ROOT="/data/renderer",LISTEN_PORT="8090",CONTROL_PLANE_URL="http://localhost:8283"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=uvicorn main:app --host 0.0.0.0 --port 8283
directory=/app/web
environment=DATA_DIR="/data/web",APP_PORT="8283",RENDERER_URL="http://localhost:8090",WEBCHANNEL_RENDERER_URL="http://localhost:8091"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webchannel]
command=nice -n 10 node src/index.js
directory=/app/webchannel
environment=DATA_ROOT="/data/webchannel",LISTEN_PORT="8091",CONTROL_PLANE_URL="http://localhost:8283"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
